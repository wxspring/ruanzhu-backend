# Production profile - all sensitive values from environment variables
# ⚠️ 所有占位符都加 :默认值（即使是空字符串），避免 "Could not resolve placeholder" 直接让应用启动失败。
#   SPRING_DATASOURCE_PASSWORD / SPRING_DATA_REDIS_PASSWORD / MINIO_ACCESS_KEY / MINIO_SECRET_KEY / JWT_SECRET
#   这些是敏感项，默认留空字符串（由部署时的环境变量注入），不要再没注入就占位符解析炸。

spring:
  # DataSource
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:}:${MYSQL_PORT:}/${MYSQL_DATABASE:}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: ${MYSQL_USER:}
    password: ${MYSQL_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000

  # Redis
  data:
    redis:
      host: ${REDIS_HOST:}
      port: ${REDIS_PORT:}
      password: ${REDIS_PASSWORD:}
      database: 0

# Storage - use MinIO in production
storage:
  profile: minio

# MinIO - override via environment if needed
minio:
  endpoint: ${MINIO_ENDPOINT:}
  access-key: ${MINIO_ACCESS_KEY:}
  secret-key: ${MINIO_SECRET_KEY:}
  bucket-name: ${MINIO_BUCKET:}

# JWT
jwt:
  secret: ${JWT_SECRET:}
  expiration: ${JWT_EXPIRATION:86400000}

# Logging - INFO level in production
logging:
  level:
    root: INFO
    com.company.ruanzhu: INFO
    org.springframework.security: WARN
  file:
    name: /app/logs/ruanzhu.log
