server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: ruanzhu
  profiles:
    active: dev

  # Jackson
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

  # Servlet
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

# MyBatis Plus
mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.company.ruanzhu.**.model
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# MinIO
minio:
  endpoint: http://localhost:9000
  access-key: admin
  secret-key: admin@123456
  bucket-name: ruanzhu-system

# Storage profile: "minio" (default, production) or "local" (dev/testing)
storage:
  profile: minio

# JWT
jwt:
  secret: ruanzhu-secret-key-must-be-at-least-256-bits-long-for-hs256
  expiration: 86400000  # 24 hours

# Async Task
task:
  execution:
    pool:
      core-size: 5
      max-size: 10
      queue-capacity: 100
    thread-name-prefix: ruanzhu-async-

# AI Configuration
ai:
  provider: qwen  # openai or qwen
  openai:
    api-key: ${OPENAI_API_KEY:}
    base-url: https://api.openai.com
    model: gpt-4
  qwen:
    api-key: ${QWEN_API_KEY:}
    model: DeepSeek-V4-Flash
    base-url:https://ws-hk7d1awi670k1rjp.cn-beijing.maas.aliyuncs.com/api/v1

# Logging
logging:
  level:
    com.company.ruanzhu: DEBUG
    org.springframework.security: INFO
