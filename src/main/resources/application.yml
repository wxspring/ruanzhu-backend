server:
  port: ${BACKEND_PORT:8080}
  servlet:
    context-path: /

spring:
  application:
    name: ruanzhu
  profiles:
    active: dev

  # me.paulschwarz:spring-dotenv（加载项目根 .env 到 Spring Environment）
  # 默认 mergeMode=unique 遇到重复 key 会抛 IllegalStateException: Duplicate key 直接让应用启动失败；
  # 改为 latest（最后一行的值覆盖前面的值，和 shell dotenv 的行为一致），避免手滑重复行导致服务起不来
  dotenv:
    enabled: true
    merge-mode: latest

  # Jackson
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

  # Servlet
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

# MyBatis Plus
mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.company.ruanzhu.**.model
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

## MinIO
## 注意：所有占位符都加了 :默认值。就算 .env 文件键名写错 / 缺失，也不会出现 "Could not resolve placeholder 'XXX'"
## 导致应用直接启动失败，最多只是 MinIO 连接不上（接口报错时再排查就行）。
#minio:
#  endpoint: MINIO_ENDPOINT
#  access-key: ${MINIO_ROOT_USER:}
#  secret-key: ${MINIO_ROOT_PASSWORD:}
#  bucket-name: ${MINIO_BUCKET:}

# Storage profile: "minio" (default, production) or "local" (dev/testing)
storage:
  profile: minio

# JWT
jwt:
  secret: ${JWT_SECRET:}
  expiration: ${JWT_EXPIRATION:86400000}  # 24 hours

# Async Task
task:
  execution:
    pool:
      core-size: 5
      max-size: 10
      queue-capacity: 100
    thread-name-prefix: ruanzhu-async-

# AI Configuration
ai:
  provider: deepseek  # openai / qwen（阿里云百炼） / deepseek（至少配置一种对应 provider 的 api-key）
  openai:
    api-key: ${OPENAI_API_KEY:}
    base-url: https://api.openai.com/v1
    model: gpt-4o-mini
  qwen:
    api-key: ${QWEN_API_KEY:}
    model: qwen-plus
    base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
  deepseek:
    api-key: ${DEEPSEEK_API_KEY:}
    base-url: https://api.deepseek.com
    model: deepseek-chat

# Logging
logging:
  level:
    com.company.ruanzhu: DEBUG
    org.springframework.security: INFO
